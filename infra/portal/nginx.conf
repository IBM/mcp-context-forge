# ContextForge Portal - single-entry reverse proxy for the testing & monitoring stack.
#
# One host port (default 9000) fronts every UI/API service via per-service virtual
# hosts: http://grafana.localhost:9000, http://locust.localhost:9000, ...
# (*.localhost resolves to 127.0.0.1 on macOS and most Linux resolvers.)
#
# Every proxy_pass goes through a variable + Docker's embedded DNS (127.0.0.11),
# so upstreams are resolved at request time. The portal therefore starts and serves
# the root page even when profiled services (monitoring, testing, sso, ...) are not
# running - requests to missing services simply return 502 until they come up.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Long-lived connections: Grafana Live, Locust UI, MCP Inspector SSE
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Root page (default vhost) ────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # CPU profile artifacts (make profile-gateway) - browsable flamegraphs
        location /profiles/ {
            autoindex on;
        }
    }

    # ── Observability ────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name grafana.localhost;
        set $upstream http://grafana:3000;
        location / {
            proxy_pass $upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
