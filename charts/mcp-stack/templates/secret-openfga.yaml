{{/* -------------------------------------------------------------------
     SECRET - OpenFGA preshared key
     -------------------------------------------------------------------
     - Skipped when openfga.existingSecret names an operator-managed
       secret.
     ------------------------------------------------------------------- */}}
{{- if and .Values.openfga.enabled (not .Values.openfga.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-stack.fullname" . }}-openfga
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app: {{ include "mcp-stack.fullname" . }}-openfga
type: Opaque
stringData:
  {{ .Values.openfga.presharedKey.secretKey | default "OPENFGA_API_TOKEN" }}: {{ .Values.openfga.presharedKey.value | quote }}
{{- end }}
