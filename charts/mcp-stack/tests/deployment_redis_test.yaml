suite: redis deployment
templates:
  - templates/deployment-redis.yaml

tests:
  - it: renders when redis enabled and not external
    set:
      redis.enabled: true
      redis.external.enabled: false
    asserts:
      - isKind:
          of: Deployment

  - it: does not render when redis disabled
    set:
      redis.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when external redis enabled
    set:
      redis.enabled: true
      redis.external.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: passes --maxclients flag with default value when persistence disabled
    set:
      redis.enabled: true
      redis.external.enabled: false
      redis.persistence.enabled: false
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "--maxclients 15000"

  - it: passes --maxclients flag with custom value when persistence disabled
    set:
      redis.enabled: true
      redis.external.enabled: false
      redis.persistence.enabled: false
      redis.maxclients: 20000
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "--maxclients 20000"

  - it: mounts redis-config volume when persistence enabled
    set:
      redis.enabled: true
      redis.external.enabled: false
      redis.persistence.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: redis-config
            mountPath: /usr/local/etc/redis

  - it: no nodeSelector rendered by default
    set:
      redis.enabled: true
      redis.external.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector

  - it: global nodeSelector is applied when set
    set:
      redis.enabled: true
      redis.external.enabled: false
      nodeSelector:
        kubernetes.io/os: linux
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/os: linux

  - it: component nodeSelector overrides global
    set:
      redis.enabled: true
      redis.external.enabled: false
      nodeSelector:
        kubernetes.io/os: linux
      redis.nodeSelector:
        node-role: redis
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: redis

  - it: no tolerations rendered by default
    set:
      redis.enabled: true
      redis.external.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.tolerations

  - it: global tolerations are applied when set
    set:
      redis.enabled: true
      redis.external.enabled: false
      tolerations:
        - key: dedicated
          operator: Equal
          value: mcp
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: mcp
            effect: NoSchedule

  - it: component tolerations override global
    set:
      redis.enabled: true
      redis.external.enabled: false
      tolerations:
        - key: global-key
          operator: Exists
          effect: NoSchedule
      redis.tolerations:
        - key: redis-key
          operator: Equal
          value: redis
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: redis-key
            operator: Equal
            value: redis
            effect: NoSchedule
      - notContains:
          path: spec.template.spec.tolerations
          content:
            key: global-key
            operator: Exists
            effect: NoSchedule

  - it: no podAnnotations rendered by default
    set:
      redis.enabled: true
      redis.external.enabled: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: global podAnnotations applied when set
    set:
      redis.enabled: true
      redis.external.enabled: false
      podAnnotations:
        com.rapid7.insightops/log: app.log
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            com.rapid7.insightops/log: app.log

  - it: component podAnnotations merged with global
    set:
      redis.enabled: true
      redis.external.enabled: false
      podAnnotations:
        com.rapid7.insightops/log: app.log
      redis.podAnnotations:
        app-specific: redis
    asserts:
      - equal:
          path: spec.template.metadata.annotations["com.rapid7.insightops/log"]
          value: app.log
      - equal:
          path: spec.template.metadata.annotations["app-specific"]
          value: redis

  - it: component podAnnotations override global on same key
    set:
      redis.enabled: true
      redis.external.enabled: false
      podAnnotations:
        shared-key: global-value
      redis.podAnnotations:
        shared-key: component-value
    asserts:
      - equal:
          path: spec.template.metadata.annotations["shared-key"]
          value: component-value

  - it: global podLabels applied to pod template
    set:
      redis.enabled: true
      redis.external.enabled: false
      podLabels:
        env: production
    asserts:
      - equal:
          path: spec.template.metadata.labels["env"]
          value: production

  - it: deployment annotations rendered when set
    set:
      redis.enabled: true
      redis.external.enabled: false
      redis.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: no deployment annotations rendered by default
    set:
      redis.enabled: true
      redis.external.enabled: false
    asserts:
      - notExists:
          path: metadata.annotations

  - it: global annotations merged with component annotations
    set:
      redis.enabled: true
      redis.external.enabled: false
      annotations:
        example.com/owner: platform-team
      redis.annotations:
        example.com/component: redis
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform-team
      - equal:
          path: metadata.annotations["example.com/component"]
          value: redis

  - it: component annotations override global on same key
    set:
      redis.enabled: true
      redis.external.enabled: false
      annotations:
        example.com/owner: global-value
      redis.annotations:
        example.com/owner: component-value
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: component-value
