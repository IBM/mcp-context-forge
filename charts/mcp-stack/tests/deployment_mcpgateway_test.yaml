suite: mcpgateway deployment
templates:
  - templates/deployment-mcpgateway.yaml
tests:
  - it: renders as a Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: name uses release fullname
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mcp-stack-mcpgateway

  - it: default replica count is 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: replica count overrideable
    set:
      mcpContextForge.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: uses correct image repository and semver tag
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "ghcr\\.io/ibm/mcp-context-forge:v?\\d+\\.\\d+\\.\\d+"

  - it: container port matches containerPort value
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 4444

  - it: selector matches pod label
    asserts:
      - equal:
          path: spec.selector.matchLabels.app
          value: RELEASE-NAME-mcp-stack-mcpgateway
      - equal:
          path: spec.template.metadata.labels.app
          value: RELEASE-NAME-mcp-stack-mcpgateway

  - it: automountServiceAccountToken is false by default
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: no nodeSelector rendered by default
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector

  - it: global nodeSelector is applied when set
    set:
      nodeSelector:
        kubernetes.io/os: linux
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/os: linux

  - it: component nodeSelector overrides global
    set:
      nodeSelector:
        kubernetes.io/os: linux
      mcpContextForge.nodeSelector:
        node-role: mcp-workloads
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: mcp-workloads

  - it: no tolerations rendered by default
    asserts:
      - notExists:
          path: spec.template.spec.tolerations

  - it: global tolerations are applied when set
    set:
      tolerations:
        - key: dedicated
          operator: Equal
          value: mcp
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: mcp
            effect: NoSchedule

  - it: component tolerations override global
    set:
      tolerations:
        - key: global-key
          operator: Exists
          effect: NoSchedule
      mcpContextForge.tolerations:
        - key: mcp-key
          operator: Equal
          value: mcp
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: mcp-key
            operator: Equal
            value: mcp
            effect: NoSchedule
      - notContains:
          path: spec.template.spec.tolerations
          content:
            key: global-key
            operator: Exists
            effect: NoSchedule

  - it: no podAnnotations rendered by default
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: global podAnnotations applied when set
    set:
      podAnnotations:
        com.rapid7.insightops/log: app.log
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            com.rapid7.insightops/log: app.log

  - it: component podAnnotations merged with global
    set:
      podAnnotations:
        com.rapid7.insightops/log: app.log
      mcpContextForge.podAnnotations:
        app-specific: gateway
    asserts:
      - equal:
          path: spec.template.metadata.annotations["com.rapid7.insightops/log"]
          value: app.log
      - equal:
          path: spec.template.metadata.annotations["app-specific"]
          value: gateway

  - it: component podAnnotations override global on same key
    set:
      podAnnotations:
        shared-key: global-value
      mcpContextForge.podAnnotations:
        shared-key: component-value
    asserts:
      - equal:
          path: spec.template.metadata.annotations["shared-key"]
          value: component-value

  - it: no podLabels rendered by default
    asserts:
      - notExists:
          path: spec.template.metadata.labels["env"]

  - it: global podLabels applied to pod template
    set:
      podLabels:
        env: production
    asserts:
      - equal:
          path: spec.template.metadata.labels["env"]
          value: production

  - it: deployment annotations rendered when set
    set:
      mcpContextForge.annotations:
        secret.reloader.stakater.com/reload: my-secret
    asserts:
      - equal:
          path: metadata.annotations["secret.reloader.stakater.com/reload"]
          value: my-secret

  - it: no deployment annotations rendered by default
    asserts:
      - notExists:
          path: metadata.annotations

  - it: global annotations merged with component annotations
    set:
      annotations:
        example.com/owner: platform-team
      mcpContextForge.annotations:
        example.com/component: gateway
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform-team
      - equal:
          path: metadata.annotations["example.com/component"]
          value: gateway

  - it: component annotations override global on same key
    set:
      annotations:
        example.com/owner: global-value
      mcpContextForge.annotations:
        example.com/owner: component-value
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: component-value
