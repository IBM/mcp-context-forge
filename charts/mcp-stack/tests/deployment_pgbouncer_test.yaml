suite: pgbouncer deployment scheduling
templates:
  - templates/deployment-pgbouncer.yaml

tests:
  - it: no nodeSelector rendered by default
    set:
      pgbouncer.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector

  - it: global nodeSelector is applied when set
    set:
      pgbouncer.enabled: true
      nodeSelector:
        kubernetes.io/os: linux
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            kubernetes.io/os: linux

  - it: component nodeSelector overrides global
    set:
      pgbouncer.enabled: true
      nodeSelector:
        kubernetes.io/os: linux
      pgbouncer.nodeSelector:
        node-role: pgbouncer
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: pgbouncer

  - it: no tolerations rendered by default
    set:
      pgbouncer.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.tolerations

  - it: global tolerations are applied when set
    set:
      pgbouncer.enabled: true
      tolerations:
        - key: dedicated
          operator: Equal
          value: mcp
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: mcp
            effect: NoSchedule

  - it: component tolerations override global
    set:
      pgbouncer.enabled: true
      tolerations:
        - key: global-key
          operator: Exists
          effect: NoSchedule
      pgbouncer.tolerations:
        - key: pgbouncer-key
          operator: Equal
          value: pgbouncer
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: pgbouncer-key
            operator: Equal
            value: pgbouncer
            effect: NoSchedule
      - notContains:
          path: spec.template.spec.tolerations
          content:
            key: global-key
            operator: Exists
            effect: NoSchedule
