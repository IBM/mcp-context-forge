name: Conformance
run-name: "Conformance for ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: read
  contents: read

jobs:
  conformance:
    name: conformance
    if: github.event_name == 'push' || !github.event.pull_request.draft
    concurrency:
      group: conformance-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out control plane
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the exact control-plane image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: mcpgateway/mcpgateway:conformance
          cache-from: |
            type=gha,scope=containerfile-lite-amd64
            type=gha,scope=cf-integration-conformance
          cache-to: type=gha,mode=max,scope=cf-integration-conformance

      - name: Install cf-integration 0.4.0 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=cf-integration-x86_64-unknown-linux-gnu.tgz
          download_dir=$(mktemp -d)
          gh release download v0.5.1 --repo contextforge-org/contextforge-dev-tools \
            --pattern "$archive" --pattern "$archive.sha256" --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check "$archive.sha256")
          tar -xzf "$download_dir/$archive" -C "$download_dir"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$download_dir/cf-integration" "$HOME/.local/bin/cf-integration"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cf-integration" --version

      - name: Run legacy-to-legacy conformance
        env:
          CARGO_TERM_COLOR: always
          CF_COMPOSE_BUILD: "false"
          CF_CONTROLPLANE_IMAGE: mcpgateway/mcpgateway:conformance
          CF_CONTROLPLANE_PULL_POLICY: never
        run: make conformance

      - name: Upload conformance diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .integration/conformance/
            .integration/reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
