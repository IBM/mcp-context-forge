[project]
name = "completion-test-server"
version = "0.1.0"
description = "Minimal MCP server fixture advertising the completions capability, used by tests/live_gateway/mcp/test_completion_federation.py (issue #6629)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "mcp-types>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
