[project]
name = "data-analysis-server"
version = "0.1.0"
description = "MCP server for comprehensive data analysis capabilities"
authors = [
    {name = "ContextForge", email = "noreply@example.com"}
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"matplotlib>=3.11.1",
    "mcp>=1.28.1,<2",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "orjson>=3.11.9",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.51",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis_server"]

[project.scripts]
data-analysis-server = "data_analysis_server.server:main"

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "W", "F", "B", "I", "N", "UP", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=data_analysis_server --cov-report=term-missing"
